name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter and venv
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
      - name: Build executable
        run: bash build-linux.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: XsdXmlBuilder-linux-x86_64
          path: dist/XsdXmlBuilder-linux-x86_64.tar.gz
          if-no-files-found: error
